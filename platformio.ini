[platformio]
default_envs = m5stack-core2

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  m5stack/M5Unified @ 0.2.10
  bblanchon/ArduinoJson @ 6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:m5stack-core2]
platform = espressif32@6.13.0
board = m5stack-core2
build_src_filter =
  +<*>
  -<main_sticks3.cpp>

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-tab5-p4
extra_scripts = pre:scripts/patch_nimble_duplicate_characteristics.py
build_flags =
  ${env.build_flags}
  -DCODEX_BOARD_TAB5=1
build_src_filter =
  +<*>
  -<main_sticks3.cpp>

[env:m5stack-sticks3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =
  +<*>
  -<main.cpp>
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCODEX_BOARD_STICKS3=1
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified @ 0.2.12
  bblanchon/ArduinoJson @ 6.21.5

[env:native]
platform = native
framework =
build_src_filter =
  -<*>
build_flags =
  -std=c++17
test_framework = unity
test_filter = test_sticks3_ui
lib_deps =
  throwtheswitch/Unity @ ^2.6.1
